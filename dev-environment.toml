[project]
name = "agentbank-go"
default_policy = "auto"
state_dir = "/var/tmp/devctl-agentbank"

[env]
PATH = "/opt/go/bin:/usr/local/bin:/usr/bin:/bin"
GOCACHE = "/root/.cache/go-build"
GOMODCACHE = "/root/go/pkg/mod"
GOTOOLCHAIN = "local"
GOMAXPROCS = "2"
CGO_ENABLED = "0"

[limits]
memory_max = "512M"
cpu_quota = "200%"
timeout = "300s"
max_parallel = 1

[tasks.fmt]
kind = "format"
weight = "light"
run = "test -z \"$(gofmt -l .)\""
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

[tasks.vet]
kind = "lint"
weight = "light"
run = "taskset -c 0 go vet ./..."
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

[tasks.test]
kind = "test"
weight = "medium"
run = "taskset -c 0 go test -count=1 ./..."
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

# Loop interno: paquetes que cambian más seguido.
[tasks.test-core]
kind = "test"
weight = "light"
run = "taskset -c 0 go test -count=1 ./internal/service/... ./internal/httpapi/... ./internal/audit/... ./internal/db/..."
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

[tasks.vet-core]
kind = "lint"
weight = "light"
run = "taskset -c 0 go vet ./internal/service/... ./internal/httpapi/..."
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

[tasks.build]
kind = "build"
weight = "medium"
run = "mkdir -p bin && go build -trimpath -ldflags='-s -w' -o bin/agentbank ./cmd/agentbank"
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }
artifacts = ["bin/agentbank"]
publish = true

[tasks.vet-fast]
kind = "lint"
weight = "light"
run = "go vet ./..."
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

[tasks.test-fast]
kind = "test"
weight = "medium"
run = "go test -count=1 ./..."
providers = ["local", "pc", "ci"]
requires = { tools = ["go"] }

[tasks.test-race]
kind = "test"
weight = "medium"
run = "go test -race -count=1 ./..."
providers = ["pc", "ci"]
requires = { tools = ["go", "gcc"] }
env = { CGO_ENABLED = "1" }
